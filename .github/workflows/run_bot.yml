name: Bagel SMP Market Scanner

on:
  schedule:
    # Trigger automatically every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to manually trigger a scan anytime via GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Execute Live Market Scan
        env:
          BAGEL_API_TOKEN: ${{ secrets.BAGEL_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bagelsmp_scanner.py
